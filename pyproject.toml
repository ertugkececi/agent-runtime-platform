[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime-platform"
version = "0.1.0"
description = "A configurable multi-agent runtime and messaging platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langgraph>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
    "openai-codex>=0.156,<0.157",
    "mcp>=1.20,<2",
    "httpx>=0.27,<1.0",
    "PyJWT[crypto]>=2.8,<3.0",
]

[project.scripts]
agent-runtime-login = "agent_runtime_platform.infrastructure.codex_login:main"
agent-runtime-worker = "agent_runtime_platform.queue_worker:main"
agent-runtime-queue-metrics = "agent_runtime_platform.infrastructure.queue_metrics:main"
agent-runtime-tenant-migrate = "agent_runtime_platform.infrastructure.tenant_migration:main"
agent-runtime-tenant-role-migrate = "agent_runtime_platform.infrastructure.tenant_roles_migration:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3.0",
    "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime_platform"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_runtime_platform/static/index.html" = "agent_runtime_platform/static/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
# The source tree is the covered set: every module in it type-checks with zero
# errors. A path is added here only once it holds that bar; see
# docs/type-checking.md.
files = ["src/agent_runtime_platform"]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness rules only: import-convention errors, syntax errors, and pyflakes
# (undefined names, unused imports and variables). Formatting rules (E7, E5, W)
# are deliberately excluded here: they describe style this repository does not
# yet enforce, and imposing them would rewrite large amounts of code in one
# step. A dedicated `ruff format` change owns that, after open work lands.
select = ["E4", "E9", "F"]
