[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime-platform"
version = "0.1.0"
description = "A configurable multi-agent runtime and messaging platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langgraph>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
    "openai-codex>=0.156,<0.157",
]

[project.scripts]
agent-runtime-login = "agent_runtime_platform.codex_login:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime_platform"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_runtime_platform/static/index.html" = "agent_runtime_platform/static/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
