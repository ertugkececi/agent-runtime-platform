<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Runtime — Sohbet</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202938;
        background: #f5f7fa;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .topbar {
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        background: #fff;
        border-bottom: 1px solid #e4e9f0;
      }
      .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: -.02em; }
      .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: #3156d3; color: white; font-size: 15px; }
      .topbar a { color: #536178; text-decoration: none; font-size: 14px; }
      .layout { width: min(1120px, calc(100% - 36px)); margin: 30px auto; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; }
      .panel, .chat { background: #fff; border: 1px solid #e4e9f0; border-radius: 16px; box-shadow: 0 10px 30px #22314a0a; }
      .panel { padding: 22px; align-self: start; }
      h1, h2, p { margin-top: 0; }
      h1 { margin-bottom: 6px; font-size: 20px; letter-spacing: -.03em; }
      .muted { color: #718096; font-size: 13px; line-height: 1.5; }
      label { display: block; margin: 16px 0 7px; color: #49566b; font-size: 12px; font-weight: 650; }
      input, select, textarea {
        width: 100%; border: 1px solid #dce2eb; border-radius: 9px; padding: 10px 11px;
        color: #202938; background: #fff; outline: none;
      }
      input:focus, select:focus, textarea:focus { border-color: #6b83e0; box-shadow: 0 0 0 3px #3156d31a; }
      textarea { min-height: 105px; resize: vertical; line-height: 1.45; }
      .button { border: 0; border-radius: 9px; padding: 10px 13px; background: #3156d3; color: #fff; font-weight: 650; }
      .button:hover { background: #2748bb; }
      .button:disabled { opacity: .55; cursor: wait; }
      .button.secondary { color: #34415a; background: #edf1f7; }
      .button.secondary:hover { background: #e2e8f1; }
      .full { width: 100%; margin-top: 14px; }
      details { margin-top: 25px; padding-top: 20px; border-top: 1px solid #edf0f4; }
      summary { color: #39465b; font-size: 13px; font-weight: 700; cursor: pointer; }
      .chat { min-height: min(760px, calc(100vh - 124px)); display: flex; flex-direction: column; overflow: hidden; }
      .chat-head { min-height: 67px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 20px; border-bottom: 1px solid #edf0f4; }
      .chat-head h2 { margin: 0; font-size: 15px; }
      .chat-head .muted { margin: 3px 0 0; }
      #status { min-height: 18px; margin: 0; color: #718096; font-size: 12px; }
      #status.error { color: #b42318; }
      .messages { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 23px; overflow-y: auto; }
      .empty { max-width: 390px; margin: auto; text-align: center; color: #7b8798; font-size: 14px; line-height: 1.6; }
      .bubble-row { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
      .bubble-row.user { align-items: flex-end; }
      .speaker { color: #8490a1; font-size: 11px; }
      .bubble { max-width: min(78%, 620px); white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px 14px; border-radius: 13px; background: #f0f3f8; line-height: 1.5; font-size: 14px; }
      .bubble-row.user .bubble { color: #fff; background: #3156d3; border-bottom-right-radius: 4px; }
      .bubble-row.agent .bubble { border-bottom-left-radius: 4px; }
      .composer { display: flex; align-items: flex-end; gap: 10px; padding: 15px 18px 18px; border-top: 1px solid #edf0f4; }
      .composer textarea { min-height: 46px; max-height: 150px; }
      .composer .button { height: 44px; min-width: 76px; }
      @media (max-width: 760px) {
        .topbar { padding: 0 17px; }
        .layout { width: min(100% - 20px, 600px); margin: 12px auto; grid-template-columns: 1fr; gap: 12px; }
        .panel { padding: 17px; }
        .chat { min-height: 58vh; }
        .bubble { max-width: 90%; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">A</span><span>Agent Runtime</span></div>
      <a href="/docs">API belgeleri</a>
    </header>
    <main class="layout">
      <aside class="panel">
        <h1>Sohbet</h1>
        <p class="muted">Bir ajan seç ve konuşmaya başla. Sohbet geçmişin bu yerel veritabanında saklanır.</p>
        <p class="muted">Gerçek yanıt için sunucuda <code>OPENAI_API_KEY</code> ayarlı olmalı.</p>
        <label for="agent-select">Ajan</label>
        <select id="agent-select" aria-label="Sohbet edilecek ajan"></select>
        <button class="button secondary full" id="new-chat" type="button">Yeni sohbet</button>

        <details id="create-agent-details">
          <summary>Yeni ajan oluştur</summary>
          <form id="create-agent-form">
            <label for="agent-name">Ad</label>
            <input id="agent-name" name="name" value="Kişisel Asistan" maxlength="120" required />
            <label for="model-name">OpenAI model kimliği</label>
            <input id="model-name" name="model_name" placeholder="Örn. model kimliği" maxlength="160" required />
            <label for="agent-instructions">Talimatlar</label>
            <textarea id="agent-instructions" name="instructions" maxlength="20000" required>Yardımcı bir asistansın. Kullanıcının diliyle yanıt ver.</textarea>
            <label for="agent-capabilities">Yetenekler (virgülle ayır)</label>
            <input id="agent-capabilities" name="capabilities" placeholder="araştırma, yazılım" />
            <button class="button full" id="create-agent-button" type="submit">Ajanı oluştur</button>
          </form>
        </details>
      </aside>

      <section class="chat" aria-label="Ajan sohbeti">
        <div class="chat-head">
          <div><h2 id="chat-title">Yeni sohbet</h2><p id="status" aria-live="polite">Ajan seçip mesaj yazabilirsin.</p></div>
        </div>
        <div class="messages" id="messages" aria-live="polite">
          <div class="empty" id="empty-state">Mesajların ve ajan yanıtların burada görünecek.</div>
        </div>
        <form class="composer" id="chat-form">
          <textarea id="message-input" placeholder="Mesajını yaz… (Ctrl/⌘ + Enter gönderir)" maxlength="20000" required></textarea>
          <button class="button" id="send-button" type="submit">Gönder</button>
        </form>
      </section>
    </main>
    <script>
      const agentSelect = document.getElementById("agent-select");
      const messagesElement = document.getElementById("messages");
      const statusElement = document.getElementById("status");
      const sendButton = document.getElementById("send-button");
      const messageInput = document.getElementById("message-input");
      const emptyState = document.getElementById("empty-state");
      const createAgentDetails = document.getElementById("create-agent-details");
      let conversationId = localStorage.getItem("agentRuntimeConversationId") || "";
      let agents = [];

      async function request(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = payload.detail;
          const message = typeof detail === "string" ? detail : detail?.error || `İstek başarısız (${response.status})`;
          const error = new Error(message);
          error.payload = detail;
          throw error;
        }
        return payload;
      }

      function setStatus(message, isError = false) {
        statusElement.textContent = message;
        statusElement.classList.toggle("error", isError);
      }

      function renderMessages(items) {
        messagesElement.replaceChildren();
        if (!items.length) {
          messagesElement.append(emptyState);
          return;
        }
        for (const item of items) {
          const isUser = item.sender_type === "user";
          const row = document.createElement("div");
          row.className = `bubble-row ${isUser ? "user" : "agent"}`;
          const speaker = document.createElement("span");
          speaker.className = "speaker";
          speaker.textContent = isUser ? "Sen" : (agents.find((agent) => agent.id === item.sender_agent_id)?.name || "Ajan");
          const bubble = document.createElement("div");
          bubble.className = "bubble";
          bubble.textContent = item.content;
          row.append(speaker, bubble);
          messagesElement.append(row);
        }
        messagesElement.scrollTop = messagesElement.scrollHeight;
      }

      async function loadConversation() {
        if (!conversationId) {
          document.getElementById("chat-title").textContent = "Yeni sohbet";
          renderMessages([]);
          return;
        }
        try {
          const conversation = await request(`/conversations/${encodeURIComponent(conversationId)}`);
          document.getElementById("chat-title").textContent = "Sohbet geçmişi";
          renderMessages(conversation.messages || []);
        } catch (error) {
          conversationId = "";
          localStorage.removeItem("agentRuntimeConversationId");
          renderMessages([]);
          setStatus("Önceki sohbet yüklenemedi. Yeni bir sohbet başlatabilirsin.", true);
        }
      }

      async function loadAgents(preferredId = "") {
        const allAgents = await request("/agents");
        agents = allAgents.filter((agent) => agent.enabled);
        agentSelect.replaceChildren();
        for (const agent of agents) {
          const option = document.createElement("option");
          option.value = agent.id;
          option.textContent = agent.name;
          agentSelect.append(option);
        }
        if (!agents.length) {
          agentSelect.disabled = true;
          createAgentDetails.open = true;
          setStatus("Sohbete başlamak için önce bir ajan oluştur.");
          return;
        }
        agentSelect.disabled = false;
        const savedAgentId = preferredId || localStorage.getItem("agentRuntimeAgentId");
        if (agents.some((agent) => agent.id === savedAgentId)) agentSelect.value = savedAgentId;
        else agentSelect.selectedIndex = 0;
        localStorage.setItem("agentRuntimeAgentId", agentSelect.value);
        createAgentDetails.open = false;
        await loadConversation();
      }

      document.getElementById("new-chat").addEventListener("click", () => {
        conversationId = "";
        localStorage.removeItem("agentRuntimeConversationId");
        localStorage.setItem("agentRuntimeAgentId", agentSelect.value);
        setStatus("Yeni sohbet hazır.");
        renderMessages([]);
        messageInput.focus();
      });

      agentSelect.addEventListener("change", () => {
        conversationId = "";
        localStorage.removeItem("agentRuntimeConversationId");
        localStorage.setItem("agentRuntimeAgentId", agentSelect.value);
        setStatus("Ajan değişti. Yeni sohbet başlatabilirsin.");
        renderMessages([]);
      });

      document.getElementById("create-agent-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("create-agent-button");
        button.disabled = true;
        setStatus("Ajan oluşturuluyor…");
        const capabilities = document.getElementById("agent-capabilities").value
          .split(",").map((value) => value.trim()).filter(Boolean);
        try {
          const agent = await request("/agents", {
            method: "POST",
            body: JSON.stringify({
              name: document.getElementById("agent-name").value,
              instructions: document.getElementById("agent-instructions").value,
              model_provider: "openai",
              model_name: document.getElementById("model-name").value,
              capabilities,
            }),
          });
          conversationId = "";
          localStorage.removeItem("agentRuntimeConversationId");
          await loadAgents(agent.id);
          setStatus("Ajan oluşturuldu. Mesajını yazabilirsin.");
          document.getElementById("agent-capabilities").value = "";
          messageInput.focus();
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          button.disabled = false;
        }
      });

      document.getElementById("chat-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const content = messageInput.value.trim();
        const agentId = agentSelect.value;
        if (!content || !agentId) return;
        sendButton.disabled = true;
        messageInput.disabled = true;
        setStatus("Ajan yanıtlıyor…");
        try {
          if (!conversationId) {
            const conversation = await request("/chat/conversations", {
              method: "POST",
              body: JSON.stringify({ agent_id: agentId }),
            });
            conversationId = conversation.id;
            localStorage.setItem("agentRuntimeConversationId", conversationId);
            localStorage.setItem("agentRuntimeAgentId", agentId);
          }
          const run = await request(`/chat/conversations/${encodeURIComponent(conversationId)}/messages`, {
            method: "POST",
            body: JSON.stringify({ content }),
          });
          messageInput.value = "";
          await loadConversation();
          setStatus(`Yanıt hazır · Çalıştırma ${run.id}`);
        } catch (error) {
          await loadConversation();
          const runId = error.payload?.run_id;
          setStatus(runId ? `${error.message} · Çalıştırma ${runId}` : error.message, true);
        } finally {
          sendButton.disabled = false;
          messageInput.disabled = false;
          messageInput.focus();
        }
      });

      messageInput.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          document.getElementById("chat-form").requestSubmit();
        }
      });

      loadAgents().catch((error) => setStatus(error.message, true));
    </script>
  </body>
</html>
